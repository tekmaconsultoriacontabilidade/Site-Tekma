<style>
:root{--navy:#050b1c;--navy2:#13224a;--g1:#b8892f;--g2:#f3d98b;--g3:#d4a63c;--ink:#0a1228;--sub:#8fa0c8}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:#02050f}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;
padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
font-family:'Montserrat',-apple-system,'Segoe UI',Arial,sans-serif;background:#02050f}
.card{position:relative;width:100%;max-width:420px;padding:44px 28px 30px;border-radius:26px;text-align:center;overflow:hidden;color:#fff;
background:radial-gradient(ellipse at 50% 12%,#13224a 0%,#050b1c 62%);border:1px solid rgba(212,166,60,.45);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.card::before{content:"";position:absolute;top:8px;right:8px;bottom:8px;left:8px;border:1px solid rgba(212,166,60,.18);border-radius:20px;pointer-events:none}
.bars{position:absolute;right:-10px;bottom:0;display:flex;align-items:flex-end;opacity:.07;pointer-events:none}
.bars i{width:34px;margin-left:14px;background:#f3d98b;display:block}
.logo{position:relative;width:150px;height:150px;margin:0 auto 26px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#f3d98b,#b8892f);box-shadow:0 0 50px rgba(212,166,60,.28)}
.logo img{width:100%;height:100%;border-radius:50%;display:block}
h1{font-weight:700;font-size:clamp(34px,11vw,48px);letter-spacing:.22em;margin-right:-.22em;line-height:1;
background:linear-gradient(180deg,#fbe9ad,#d4a63c 55%,#b8892f);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.tag{margin:14px 0 34px;font-size:10.5px;font-weight:600;letter-spacing:.34em;color:#d4a63c;text-transform:uppercase}
.btn{position:relative;display:flex;align-items:center;margin-bottom:14px;padding:9px 22px 9px 9px;border-radius:999px;text-decoration:none;color:#0a1228;cursor:pointer;
background:linear-gradient(100deg,#b8892f,#f3d98b 50%,#d4a63c);box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .2s,box-shadow .2s}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 12px 28px rgba(212,166,60,.35),inset 0 1px 0 rgba(255,255,255,.6);outline:none}
.btn:active{transform:scale(.98)}
.ic{flex:none;width:44px;height:44px;margin-right:14px;border-radius:50%;background:#0a1228;display:flex;align-items:center;justify-content:center}
.ic svg{width:21px;height:21px;fill:none;stroke:#f3d98b;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn span{flex:1;text-align:center;font-weight:600;font-size:16px;letter-spacing:.02em;margin-right:58px}
.hint{margin-top:26px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.hint svg{width:34px;height:34px;margin-right:10px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:float 1.6s ease-in-out infinite;will-change:transform}
@keyframes float{0%,100%{transform:translateY(4px) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.hint svg{animation:none}}
.foot{margin-top:14px;font-size:10px;letter-spacing:.28em;color:#8fa0c8;text-transform:uppercase}
